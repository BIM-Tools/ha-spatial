# HACS installs the zip of the newest release without checking that it exists, so a tag push
# builds the zip first and only then creates the release with it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      # v6.0.2 and newer keep the annotated tag; older versions replace it with a lightweight
      # one, and --notes-from-tag would then publish the commit message as release notes.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci && npm run build
        working-directory: frontend

      # Every package that esbuild bundles into the panel and card, plus the copied MapLibre
      # chunks, needs its licence in the zip. All turf packages share one MIT notice (their
      # LICENSE files are identical). Re-check the list when a dependency changes:
      # esbuild --metafile lists the bundled node_modules packages.
      - run: |
          out=custom_components/spatial/frontend
          while read -r name src; do
            cp "$src" "$out/LICENSE-$name.txt"
          done <<'LIST'
          maplibre-gl frontend/node_modules/maplibre-gl/LICENSE.txt
          lit frontend/node_modules/lit/LICENSE
          lit-html frontend/node_modules/lit-html/LICENSE
          lit-element frontend/node_modules/lit-element/LICENSE
          lit-reactive-element frontend/node_modules/@lit/reactive-element/LICENSE
          turf frontend/node_modules/@turf/helpers/LICENSE
          point-in-polygon-hao frontend/node_modules/point-in-polygon-hao/LICENSE
          robust-predicates frontend/node_modules/robust-predicates/LICENSE
          polyclip-ts frontend/node_modules/polyclip-ts/LICENSE
          bignumber.js frontend/node_modules/bignumber.js/LICENCE.md
          splaytree-ts frontend/node_modules/splaytree-ts/LICENSE
          mdi-js frontend/node_modules/@mdi/js/LICENSE
          polylabel frontend/node_modules/polylabel/LICENSE
          tinyqueue frontend/node_modules/tinyqueue/LICENSE
          LIST
          # src/map-paint.ts ports code from Home Assistant's frontend; keep the tag equal to its source link.
          curl -fsSL https://raw.githubusercontent.com/home-assistant/frontend/20260930.3/LICENSE.md \
            -o "$out/LICENSE-home-assistant-frontend.txt"

      # The tag is the version, so manifest.json in the repository is not bumped by hand.
      - run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          zip -r ../../spatial.zip .
        working-directory: custom_components/spatial

      - run: gh release create "$GITHUB_REF_NAME" spatial.zip --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
