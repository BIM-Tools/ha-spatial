# Draws one room in the panel of a fresh Home Assistant, in a real browser.
name: E2E

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: docker compose run --rm e2e

      - if: failure()
        run: docker compose logs homeassistant-e2e

      - if: always()
        run: docker compose down
