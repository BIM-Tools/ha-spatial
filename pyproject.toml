[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-spatial"
version = "0.1.0"
description = "Room footprints for Home Assistant areas, on the same map as your zones"
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "MIT" }
authors = [
    { name = "Jan Brouwer", email = "jan@brewsky.nl" }
]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/spatial"]
strict = true
warn_unreachable = true
implicit_reexport = true

# Home Assistant types its schemas with probatio markers; we still use voluptuous.
[[tool.mypy.overrides]]
module = "spatial.websocket_api"
disable_error_code = ["dict-item"]

[tool.coverage.report]
fail_under = 99
