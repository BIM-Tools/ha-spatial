<!doctype html>
<!--
  Development viewer for the Spatial integration. Not part of the integration.
  Copy to <config>/www/ and open http://<ha>:8123/local/viewer.html#token=<long-lived token>
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spatial viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; font: 14px system-ui, sans-serif; }
    #floors { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; }
    #floors button { padding: 6px 10px; border: 0; border-radius: 4px; background: #fff; cursor: pointer; }
    #floors button.active { background: #03a9f4; color: #fff; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="floors"></div>
<script type="module">
  import {
    createConnection, createLongLivedTokenAuth,
  } from "https://cdn.jsdelivr.net/npm/home-assistant-js-websocket@9.7.1/+esm";

  const token = new URLSearchParams(location.hash.slice(1)).get("token");
  const conn = await createConnection({ auth: createLongLivedTokenAuth(location.origin, token) });
  const call = (type, data = {}) => conn.sendMessagePromise({ type, ...data });

  // Home Assistant's own map: the vector style its frontend ships, with tiles,
  // fonts and sprites from core's map_tiles proxy. The proxy needs a rotating
  // token (two are valid at a time, each for 30 minutes), sent as a header.
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const style = await (await fetch(`/static/map/${dark ? "dark" : "light"}.json`)).json();
  // MapLibre 5 needs absolute sprite and glyph URLs; the shipped style is root-relative.
  style.sprite = style.sprite.map((s) => ({ ...s, url: new URL(s.url, location.origin).href }));
  style.glyphs = location.origin + style.glyphs;
  let tilesToken = (await call("map_tiles/access_token")).token;
  setInterval(async () => { tilesToken = (await call("map_tiles/access_token")).token; }, 20 * 60 * 1000);

  // Same-origin branch of withMapTilesToken in home-assistant/frontend
  // src/data/map_tiles.ts: absolute URL, token in the X-Map-Tiles-Token header.
  const transformRequest = (url) => {
    const absolute = new URL(url, location.origin);
    return absolute.pathname.startsWith("/api/map_tiles/")
      ? { url: absolute.href, headers: { "X-Map-Tiles-Token": tilesToken } }
      : { url: absolute.href };
  };

  const site = await call("spatial/site");
  const map = new maplibregl.Map({
    container: "map", style, transformRequest,
    center: [site.lon, site.lat], zoom: 19, pitch: 50,
    bearing: site.bearing_deg,  // the site's x-axis points up
  });
  window.__map = map;  // for debugging from the console
  await map.once("load");

  // "All" shows floors stacked in 3D; a single level shows a flat plan with room outlines.
  const color = ["interpolate", ["linear"], ["get", "level"], 0, "#4caf50", 2, "#2196f3"];
  map.addSource("areas", { type: "geojson", data: await call("spatial/geojson") });
  map.addLayer({
    id: "areas-3d", type: "fill-extrusion", source: "areas",
    paint: {
      "fill-extrusion-color": color,
      "fill-extrusion-base": ["get", "base_height"],
      "fill-extrusion-height": ["get", "height"],
      "fill-extrusion-opacity": 0.7,
    },
  });
  map.addLayer({ id: "areas-2d", type: "fill", source: "areas",
    layout: { visibility: "none" }, paint: { "fill-color": color, "fill-opacity": 0.4 } });
  map.addLayer({ id: "outlines", type: "line", source: "areas",
    layout: { visibility: "none" }, paint: { "line-color": "#212121", "line-width": 2 } });

  // Floor buttons: show one level, or all.
  const levels = [...new Set((await call("spatial/geojson")).features.map((f) => f.properties.level))]
    .sort((a, b) => a - b);
  for (const level of ["all", ...levels]) {
    const button = document.createElement("button");
    button.textContent = level === "all" ? "All" : `Level ${level}`;
    button.onclick = () => {
      const flat = level !== "all";
      map.setLayoutProperty("areas-3d", "visibility", flat ? "none" : "visible");
      for (const id of ["areas-2d", "outlines"]) {
        map.setLayoutProperty(id, "visibility", flat ? "visible" : "none");
        map.setFilter(id, flat ? ["==", ["get", "level"], level] : null);
      }
      map.easeTo({ pitch: flat ? 0 : 50 });
      document.querySelectorAll("#floors button").forEach((b) => b.classList.toggle("active", b === button));
    };
    document.getElementById("floors").append(button);
  }

  // Pick house: click a building near one of its walls. The building comes from
  // the OSM buildings in Home Assistant's vector tiles; the nearest edge sets
  // the site direction (bearing = edge direction); the centre follows the footprints.
  let picking = false;
  const buildingLayers = style.layers.filter((l) => l["source-layer"] === "buildings").map((l) => l.id);
  map.addSource("picked", { type: "geojson", data: turf.featureCollection([]) });
  map.addLayer({ id: "picked", type: "line", source: "picked",
    paint: { "line-color": ["match", ["get", "kind"], "edge", "#e91e63", "#ff9800"],
      "line-width": ["match", ["get", "kind"], "edge", 6, 3] } });
  const pickButton = document.createElement("button");
  pickButton.textContent = "Pick house";
  pickButton.onclick = () => {
    picking = !picking;
    pickButton.classList.toggle("active", picking);
    map.getCanvas().style.cursor = picking ? "crosshair" : "";
  };
  document.getElementById("floors").append(pickButton);

  map.on("click", (e) => {
    if (!picking) return;
    // The tiles hold all buildings of a tile as one MultiPolygon without
    // attributes; each part is one building. Take the part under the click.
    const [buildings] = map.queryRenderedFeatures(e.point, { layers: buildingLayers });
    if (!buildings) return;
    const parts = buildings.geometry.type === "MultiPolygon"
      ? buildings.geometry.coordinates : [buildings.geometry.coordinates];
    const click = turf.point(e.lngLat.toArray());
    const polygon = parts.find((part) => turf.booleanPointInPolygon(click, turf.polygon(part)));
    if (!polygon) return;
    const outline = turf.lineString(polygon[0]);
    const index = turf.nearestPointOnLine(outline, turf.point(e.lngLat.toArray())).properties.index;
    const [start, end] = [polygon[0][index], polygon[0][index + 1]];
    const bearing = Math.round(((turf.bearing(start, end) + 360) % 360) * 100) / 100;
    map.getSource("picked").setData(turf.featureCollection([
      turf.feature(outline.geometry, { kind: "building" }),
      turf.lineString([start, end], { kind: "edge" }),
    ]));

    const button = document.createElement("button");
    button.textContent = `Set as site direction (bearing ${bearing}°)`;
    button.onclick = async () => {
      await call("spatial/site/update", { bearing_deg: bearing });
      popup.remove();
      pickButton.click();
      map.easeTo({ bearing });
    };
    const popup = new maplibregl.Popup().setLngLat(e.lngLat).setDOMContent(button).addTo(map);
  });

  // Click a room: name, size and adjacent areas.
  map.on("click", ["areas-3d", "areas-2d"], async (e) => {
    if (picking) return;
    const p = e.features[0].properties;
    const { area_ids } = await call("spatial/area/adjacent", { area_id: p.area_id });
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML(`<b>${p.name}</b><br>${p.area_m2} m²<br>Adjacent: ${area_ids.join(", ") || "none"}`)
      .addTo(map);
  });

  // Reload when spatial data changes.
  conn.subscribeEvents(async () => map.getSource("areas").setData(await call("spatial/geojson")),
    "spatial_updated");
</script>
</body>
</html>
