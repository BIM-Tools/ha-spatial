<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Source of custom_components/spatial/brand/icon*.png: a floor plan seen from above,
       drawn like a SketchUp sketch (edges overshoot their corners, slight wobble). -->
  <g stroke="none">
    <!-- outer wall band -->
    <path fill="#a8723f" fill-rule="evenodd"
          d="M36 48 L476 48 L476 384 L364 384 L364 464 L36 464 Z
             M60 72 L452 72 L452 360 L340 360 L340 440 L60 440 Z"/>
    <!-- rooms -->
    <path fill="#ffffff" d="M60 72 L250 72 L250 280 L60 280 Z"/>
    <path fill="#d6d6d6" d="M250 72 L452 72 L452 200 L250 200 Z"/>
    <path fill="#ececec" d="M340 200 L452 200 L452 360 L340 360 Z"/>
    <path fill="#03a9f4" d="M60 280 L250 280 L250 200 L340 200 L340 440 L60 440 Z"/>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer face of the outer wall -->
    <g stroke-width="11">
      <path d="M20 49 Q 250 44 492 48"/>
      <path d="M37 32 Q 32 250 36 480"/>
      <path d="M21 463 Q 200 468 380 464"/>
      <path d="M475 33 Q 480 220 476 400"/>
      <path d="M348 385 Q 420 381 492 384"/>
      <path d="M364 368 Q 361 420 365 480"/>
    </g>
    <!-- inner face of the outer wall -->
    <g stroke-width="9">
      <path d="M48 72 Q 260 69 464 73"/>
      <path d="M60 60 Q 57 270 61 452"/>
      <path d="M48 440 Q 200 443 352 439"/>
      <path d="M452 60 Q 455 220 451 372"/>
      <path d="M328 360 Q 400 362 464 359"/>
    </g>
    <!-- interior walls; a door gap between the blue room and the room above it -->
    <g stroke-width="11">
      <path d="M250 62 Q 247 170 251 292"/>
      <path d="M50 281 Q 78 279 104 281"/>
      <path d="M176 280 Q 218 282 262 279"/>
      <path d="M238 200 Q 350 197 462 201"/>
      <path d="M340 188 Q 343 320 339 452"/>
    </g>
    <!-- door leaf and swing -->
    <g stroke-width="8">
      <path d="M106 281 L 108 214"/>
      <path d="M108 214 Q 170 220 175 280" stroke-dasharray="1 15"/>
    </g>
  </g>
</svg>
